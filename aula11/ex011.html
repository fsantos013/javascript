<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <input type="text" name="nacionalidade" id="nacionalidade" placeholder="Digite sua nacionalidade">
    <input type="button" value="Verificar" onclick="verificar()">
    <div id="res">
    </div>
    <script>
        function verificar() {
            var pais = window.document.querySelector('input#nacionalidade')
            var res = window.document.querySelector('div#res')
            var país = String(pais.value)
            res.innerHTML = `<p>Nascido no(a) <strong>${país}</strong></p>`
            if (país != 'Brasil') {
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            } else {
                res.innerHTML += `<p>Você é brasileiro!</p>`
            }
        }
    </script>
</body>
</html>
